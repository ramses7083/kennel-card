
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">

  <title>Pet Identification | Contact Owner</title>
  <meta name="description" content="Pet identification and owner contact information.">

  <style>
    :root {
      color-scheme: dark;
      --bg: #101827;
      --panel: #1b2638;
      --text: #ffffff;
      --muted: #c2ccda;
      --border: #38465a;
      --accent: #f2c078;
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: max(16px, env(safe-area-inset-top))
               16px
               max(24px, env(safe-area-inset-bottom));
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    .photo {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      background: #fff;
      border-radius: 18px;
      border: 1px solid var(--border);
    }

    h1 {
      margin: 22px 0 8px;
      font-size: clamp(32px, 9vw, 42px);
      line-height: 1.1;
      letter-spacing: -0.8px;
    }

    .instruction {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.55;
    }

    .actions {
      display: grid;
      gap: 12px;
    }

    .action {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 72px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
      color: var(--text);
      text-decoration: none;
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .action:active {
      opacity: .82;
    }

    .action:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    .icon {
      display: grid;
      place-items: center;
      flex: 0 0 44px;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #2b394d;
      font-size: 23px;
    }

    .copy {
      display: grid;
      gap: 5px;
      min-width: 0;
    }

    .title {
      font-size: 17px;
      font-weight: 700;
    }

    .detail {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .call {
      background: var(--accent);
      color: #171c25;
      border-color: var(--accent);
    }

    .call .icon {
      background: rgba(0, 0, 0, .09);
    }

    .call .detail {
      color: #34302a;
    }

    .footer {
      margin-top: 22px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    @media (min-width: 600px) {
      body {
        padding-top: 32px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <main>
    <img
      class="photo"
      src="./Sabina.jpg"
      alt="Sabina, the dog associated with this kennel"
      width="960"
      height="960"
      fetchpriority="high"
    >

    <h1>Sabina</h1>

    <p class="instruction">
      Have you found this kennel or need to contact the owner?
      Please use any of the options below.
    </p>

    <section class="actions" aria-label="Owner contact options">

      <a class="action call" href="tel:+523121329025">
        <span class="icon" aria-hidden="true">☎</span>
        <span class="copy">
          <span class="title">Call Owner</span>
          <span class="detail">+52 312 132 9025</span>
        </span>
      </a>

      <a class="action"
         href="https://wa.me/523121329025"
         target="_blank"
         rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">💬</span>
        <span class="copy">
          <span class="title">WhatsApp</span>
          <span class="detail">Message the owner</span>
        </span>
      </a>

      <a class="action" href="mailto:ramses7083@gmail.com">
        <span class="icon" aria-hidden="true">✉</span>
        <span class="copy">
          <span class="title">Email</span>
          <span class="detail">ramses7083@gmail.com</span>
        </span>
      </a>

      <a class="action"
         href="https://www.instagram.com/sabina_colimota/"
         target="_blank"
         rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">◎</span>
        <span class="copy">
          <span class="title">Instagram</span>
          <span class="detail">@sabina_colimota</span>
        </span>
      </a>

      <button class="action" id="saveContact" type="button">
        <span class="icon" aria-hidden="true">＋</span>
        <span class="copy">
          <span class="title">Save Owner Contact</span>
          <span class="detail">Ramses - Dog Sabina</span>
        </span>
      </button>

    </section>

    <footer class="footer">
      Pet identification and owner contact information.
    </footer>
  </main>

  <script>
    document.getElementById("saveContact").addEventListener("click", () => {
      const lines = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        "N:;Ramses - Dog Sabina;;;",
        "FN:Ramses - Dog Sabina",
        "TEL;TYPE=CELL,VOICE:+523121329025",
        "EMAIL;TYPE=INTERNET:ramses7083@gmail.com",
        "URL:https://www.instagram.com/sabina_colimota/",
        "NOTE:Owner contact for the dog associated with this kennel.",
        "END:VCARD"
      ];

      const blob = new Blob(
        [lines.join("\r\n") + "\r\n"],
        { type: "text/vcard;charset=utf-8" }
      );

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "Ramses-Dog-Sabina.vcf";
      document.body.appendChild(link);
      link.click();
      link.remove();

      setTimeout(() => URL.revokeObjectURL(url), 3000);
    });
  </script>
</body>
</html>
